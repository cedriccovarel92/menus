<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jojo cooker</title>
<meta name="description" content="Jojo cooker : menus de la famille, portions de 200 g pour Johan, courses partagées, mode cuisine et Plaisir sucré.">
<meta name="theme-color" content="#b5563a">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Automne · 2 adultes + Johan, 13 mois</div>
      <h1>Jojo cooker</h1>
      <p>Chaque repas de Johan pèse 200 g, prélevé avant l'assaisonnement des adultes.</p>
    </div>
    <div class="sync" id="sync"><i></i><span>Enregistré sur cet appareil</span></div>
  </header>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabbar" role="tablist">
    <button role="tab" data-tab="calendrier" id="t-calendrier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendrier</button>
    <button role="tab" data-tab="courses" id="t-courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h2l2 10h10l2-7H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Courses</button>
    <button role="tab" data-tab="recettes" id="t-recettes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><circle cx="12" cy="13" r="4"/><path d="M12 2v3"/></svg>Recettes</button>
    <button role="tab" data-tab="sucre" id="t-sucre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14l-1.6 8H6.6z"/><path d="M6 12a6 6 0 0 1 12 0"/><path d="M12 6V3"/></svg>Sucré</button>
    <button role="tab" data-tab="johan" id="t-johan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="4" ry="5"/><path d="M12 12v9"/></svg>Johan</button>
    <button role="tab" data-tab="importer" id="t-importer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Importer</button>
  </div>
</nav>

<div class="gate" id="gate" hidden>
  <div class="gatebox">
    <div class="eyebrow">Accès réservé</div>
    <h2>Jojo cooker</h2>
    <p class="muted" id="gateMsg">Connectez-vous avec un compte Google autorisé pour voir les menus et la liste de courses partagée.</p>
    <button class="btn primary" id="gateBtn" hidden>Se connecter avec Google</button>
  </div>
</div>
<main class="wrap" id="main"></main>
<div class="cook" id="cook" hidden role="dialog" aria-modal="true" aria-label="Mode cuisine"></div>
<div class="timerbar" id="timerbar" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" multiple accept=".txt,.md,.csv,.json,.html,.htm,.docx,.pdf,image/*" hidden>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<script src="firebase-config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
